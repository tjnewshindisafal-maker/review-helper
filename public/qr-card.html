<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Review Card</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: Arial, Helvetica, sans-serif;
  background: #e8eaf0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 30px 20px;
}
.toolbar {
  margin-bottom: 24px;
  display: flex;
  gap: 12px;
  align-items: center;
}
.btn {
  padding: 11px 28px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.3px;
  transition: background 0.2s;
}
.btn-dl { background: #1a73e8; color: #fff; }
.btn-dl:hover { background: #1557b0; }
.btn-back { background: #fff; color: #333; border: 1.5px solid #ddd; }
.btn-back:hover { background: #f5f5f5; }

/* ===== ID CARD ===== */
.card {
  width: 320px;
  background: #fff;
  border-radius: 20px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.18);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 28px 22px 18px;
  position: relative;
  overflow: hidden;
}

/* Google 4-color right border */
.card::after {
  content: '';
  position: absolute;
  top: 0; right: 0;
  width: 7px;
  height: 100%;
  background: linear-gradient(
    to bottom,
    #4285F4 0%, #4285F4 25%,
    #EA4335 25%, #EA4335 50%,
    #FBBC04 50%, #FBBC04 75%,
    #34A853 75%, #34A853 100%
  );
}

.logo-circle {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  border: 2px solid #e8e8e8;
  background: #fafafa;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 36px;
  margin-bottom: 16px;
  overflow: hidden;
}
.logo-circle img {
  width: 100%; height: 100%; object-fit: contain;
}

.google-logo {
  font-size: 30px;
  font-weight: 700;
  letter-spacing: -0.5px;
  line-height: 1;
  margin-bottom: 6px;
}
.g-b { color: #4285F4; }
.g-r { color: #EA4335; }
.g-y { color: #FBBC04; }
.g-g { color: #34A853; }

.stars {
  color: #FBBC04;
  font-size: 22px;
  letter-spacing: 3px;
  margin-bottom: 14px;
}

.scan-label {
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 2px;
  color: #111;
  text-align: center;
}
.scan-sub {
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 1.5px;
  color: #666;
  text-align: center;
  margin-top: 2px;
  margin-bottom: 14px;
}

#qrcode {
  padding: 8px;
  border: 2px solid #f0f0f0;
  border-radius: 10px;
  background: #fff;
  margin-bottom: 16px;
}
#qrcode canvas { display: block; }

.biz-name {
  font-size: 13px;
  font-weight: 800;
  color: #111;
  text-align: center;
  line-height: 1.4;
  margin-bottom: 14px;
  padding: 0 10px;
}

.card-footer {
  width: 100%;
  border-top: 1px solid #eee;
  padding-top: 10px;
  text-align: center;
}
.card-domain {
  font-size: 9px;
  color: #999;
  letter-spacing: 0.3px;
}
.card-powered {
  font-size: 9px;
  color: #aaa;
  margin-top: 3px;
}
.card-powered span { color: #1a73e8; font-weight: 700; }

@media print {
  .toolbar { display: none; }
  body { background: white; padding: 0; }
  .card { box-shadow: none; }
}
</style>
</head>
<body>

<div class="toolbar" id="toolbar">
  <button class="btn btn-back" onclick="history.back()">← Back</button>
  <button class="btn btn-dl" id="dlBtn" onclick="downloadCard()">⬇ Download PNG</button>
</div>

<div class="card" id="card">
  <div class="logo-circle" id="logoCircle">
    <span id="iconEmoji">🏢</span>
  </div>

  <div class="google-logo">
    <span class="g-b">G</span><span class="g-r">o</span><span class="g-y">o</span><span class="g-b">g</span><span class="g-g">l</span><span class="g-r">e</span>
  </div>
  <div class="stars">★★★★★</div>

  <div class="scan-label">SCAN QR CODE</div>
  <div class="scan-sub">TO LEAVE US A REVIEW</div>

  <div id="qrcode"></div>

  <div class="biz-name" id="bizName">Loading...</div>

  <div class="card-footer">
    <div class="card-domain">reviews.advizrmedia.com</div>
    <div class="card-powered">Powered by <span>Advizr Media</span></div>
  </div>
</div>

<script>
const params = new URLSearchParams(location.search);
const bizId = params.get('b');

async function init() {
  if (!bizId) {
    document.getElementById('bizName').textContent = 'No business ID';
    return;
  }
  let biz;
  try {
    const res = await fetch('/business/' + bizId);
    if (!res.ok) throw new Error();
    biz = await res.json();
  } catch(e) {
    document.getElementById('bizName').textContent = 'Business not found';
    return;
  }

  document.title = biz.name + ' — QR Card';
  document.getElementById('bizName').textContent = biz.name;

  if (biz.icon) document.getElementById('iconEmoji').textContent = biz.icon;

  const url = biz.googleLink || ('https://reviews.advizrmedia.com/?b=' + bizId);
  new QRCode(document.getElementById('qrcode'), {
    text: url,
    width: 160,
    height: 160,
    colorDark: '#000000',
    colorLight: '#ffffff',
    correctLevel: QRCode.CorrectLevel.M
  });
}

function downloadCard() {
  const toolbar = document.getElementById('toolbar');
  toolbar.style.display = 'none';
  const btn = document.getElementById('dlBtn');
  btn.textContent = 'Generating...';
  btn.disabled = true;

  setTimeout(() => {
    html2canvas(document.getElementById('card'), {
      scale: 4,
      backgroundColor: '#ffffff',
      useCORS: true,
      logging: false
    }).then(canvas => {
      const link = document.createElement('a');
      link.download = (bizId || 'qr') + '-review-card.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
      toolbar.style.display = 'flex';
      btn.textContent = '⬇ Download PNG';
      btn.disabled = false;
    });
  }, 300);
}

init();
</script>
</body>
</html>
