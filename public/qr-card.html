<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Review Card</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #f0f0f0; font-family: 'Segoe UI', Arial, sans-serif; }

.controls {
  padding: 20px 24px;
  background: #fff;
  box-shadow: 0 2px 8px rgba(0,0,0,.1);
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}
.controls h2 { font-size: 18px; font-weight: 800; color: #1a1a2e; }
.biz-name { font-size: 14px; color: #4285F4; font-weight: 700; }
.print-btn {
  background: #4285F4; color: #fff; border: none;
  padding: 10px 24px; border-radius: 50px; font-size: 14px;
  font-weight: 700; cursor: pointer; margin-left: auto;
}
.print-btn:hover { background: #3367d6; }

/* A2 size = 420mm x 594mm */
.card-wrapper {
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 40px 20px;
  min-height: 100vh;
}

.card {
  width: 420mm;
  min-height: 594mm;
  background: #fff;
  border-radius: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  padding: 40mm 30mm;
  position: relative;
  overflow: hidden;
  box-shadow: 0 8px 40px rgba(0,0,0,.15);
}

/* Background decorative circles */
.card::before {
  content: '';
  position: absolute;
  top: -80px;
  right: -80px;
  width: 300px;
  height: 300px;
  background: radial-gradient(circle, #e8f0fe 0%, transparent 70%);
  border-radius: 50%;
}
.card::after {
  content: '';
  position: absolute;
  bottom: -80px;
  left: -80px;
  width: 300px;
  height: 300px;
  background: radial-gradient(circle, #e8f0fe 0%, transparent 70%);
  border-radius: 50%;
}

.top-section {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  position: relative;
  z-index: 1;
}

/* Logo */
.logo-wrap {
  width: 140px;
  height: 140px;
  border-radius: 50%;
  background: #f8faff;
  border: 3px solid #e8eaf0;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  margin-bottom: 20px;
  box-shadow: 0 4px 20px rgba(0,0,0,.1);
}
.logo-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.logo-placeholder {
  font-size: 56px;
  line-height: 1;
}

/* Business name */
.biz-title {
  font-size: 36px;
  font-weight: 900;
  color: #1a1a2e;
  text-align: center;
  margin-bottom: 8px;
  line-height: 1.2;
}
.biz-loc {
  font-size: 20px;
  color: #888;
  text-align: center;
  margin-bottom: 32px;
}

/* Google logo */
.google-row {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  margin-bottom: 24px;
}
.g-logo {
  font-size: 52px;
  font-weight: 900;
  letter-spacing: -2px;
  line-height: 1;
}
.g1{color:#4285F4}.g2{color:#EA4335}.g3{color:#FBBC05}.g4{color:#34A853}
.stars {
  color: #FBBC05;
  font-size: 48px;
  letter-spacing: 6px;
}

/* Scan text */
.scan-title {
  font-size: 32px;
  font-weight: 900;
  color: #1a1a2e;
  text-align: center;
  text-transform: uppercase;
  letter-spacing: 3px;
  margin-bottom: 6px;
}
.scan-sub {
  font-size: 18px;
  color: #666;
  text-align: center;
  letter-spacing: 1px;
  margin-bottom: 36px;
}

/* QR Code */
.qr-section {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.qr-frame {
  background: #fff;
  border: 6px solid #4285F4;
  border-radius: 24px;
  padding: 20px;
  box-shadow: 0 8px 40px rgba(66,133,244,.2);
  margin-bottom: 28px;
}
canvas { display: block; }

/* URL */
.url-text {
  font-size: 18px;
  color: #888;
  letter-spacing: 1px;
  margin-bottom: 32px;
}

/* Bottom */
.bottom-section {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  position: relative;
  z-index: 1;
}
.divider {
  width: 80%;
  height: 1px;
  background: linear-gradient(90deg, transparent, #e8eaf0, transparent);
  margin-bottom: 20px;
}
.powered {
  font-size: 16px;
  color: #aaa;
  letter-spacing: 1px;
}
.powered b { color: #4285F4; }

/* Print styles */
@media print {
  body { background: #fff; }
  .controls { display: none !important; }
  .card-wrapper { padding: 0; }
  .card {
    width: 420mm;
    min-height: 594mm;
    box-shadow: none;
    page-break-after: always;
  }
}
</style>
</head>
<body>

<div class="controls" id="controls">
  <h2>QR Review Card &mdash; A2 Print Size</h2>
  <span class="biz-name" id="ctrl-name">Loading...</span>
  <button class="print-btn" onclick="window.print()">&#128424; Print / Save as PDF</button>
</div>

<div class="card-wrapper">
  <div class="card" id="card">

    <div class="top-section">
      <!-- Logo -->
      <div class="logo-wrap" id="logo-wrap">
        <div class="logo-placeholder" id="logo-placeholder">&#11088;</div>
      </div>

      <!-- Business Name -->
      <div class="biz-title" id="biz-title">Business Name</div>
      <div class="biz-loc" id="biz-loc"></div>

      <!-- Google -->
      <div class="google-row">
        <div class="g-logo">
          <span class="g1">G</span><span class="g2">o</span><span class="g3">o</span><span class="g1">g</span><span class="g4">l</span><span class="g2">e</span>
        </div>
        <div class="stars">&#9733;&#9733;&#9733;&#9733;&#9733;</div>
      </div>

      <!-- Scan Text -->
      <div class="scan-title">Scan QR Code</div>
      <div class="scan-sub">To Leave Us a Review</div>
    </div>

    <!-- QR Code -->
    <div class="qr-section">
      <div class="qr-frame">
        <canvas id="qr-canvas"></canvas>
      </div>
      <div class="url-text">reviews.advizrmedia.com</div>
    </div>

    <!-- Bottom -->
    <div class="bottom-section">
      <div class="divider"></div>
      <div class="powered">Powered by <b>Advizr Media</b></div>
    </div>

  </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const bizId = params.get('b');

if (!bizId) {
  document.getElementById('biz-title').textContent = 'No Business ID';
  document.getElementById('ctrl-name').textContent = 'No Business ID — add ?b=businessid to URL';
} else {
  fetch('/business/' + bizId)
    .then(r => r.json())
    .then(biz => {
      // Business name & location
      document.getElementById('biz-title').textContent = biz.name;
      document.getElementById('ctrl-name').textContent = biz.name;
      if (biz.location) document.getElementById('biz-loc').textContent = biz.location;

      // Icon / Logo
      const logoWrap = document.getElementById('logo-wrap');
      if (biz.logo) {
        logoWrap.innerHTML = '<img src="' + biz.logo + '" alt="logo">';
      } else if (biz.icon) {
        document.getElementById('logo-placeholder').textContent = biz.icon;
      }

      // Page title
      document.title = biz.name + ' — QR Review Card';

      // Generate QR
      const url = 'https://reviews.advizrmedia.com/?b=' + bizId;
      QRCode.toCanvas(document.getElementById('qr-canvas'), url, {
        width: 400,
        margin: 1,
        color: { dark: '#000000', light: '#ffffff' }
      });
    })
    .catch(() => {
      document.getElementById('biz-title').textContent = 'Business not found';
    });
}
</script>
</body>
</html>
