<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Poster</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f0f0f0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:Arial,sans-serif;padding:20px}
.controls{margin-bottom:20px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{padding:10px 22px;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer}
.btn-print{background:#4285F4;color:white}
.card{width:320px;background:white;border-radius:16px;padding:28px 24px 20px;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,0.15)}
.logos-row{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:18px}
.client-logo-wrap{width:68px;height:68px;border-radius:50%;border:2px solid #e0e0e0;display:flex;align-items:center;justify-content:center;background:#f8f9ff;flex-shrink:0;overflow:hidden}
.client-logo-wrap img{width:100%;height:100%;object-fit:contain;padding:6px}
.client-name-text{font-size:9px;font-weight:900;color:#333;text-align:center;line-height:1.3;padding:6px;word-break:break-word}
.divider-dot{width:6px;height:6px;background:#ddd;border-radius:50%}
.ai-logo-wrap{width:68px;height:68px;border-radius:50%;border:2px solid #4285F4;display:flex;align-items:center;justify-content:center;background:#EEF2FF;flex-shrink:0}
.ai-logo-inner{font-size:9px;font-weight:900;color:#4285F4;text-align:center;line-height:1.4;padding:4px}
.g-text{display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:900;letter-spacing:-1px;line-height:1;margin-bottom:8px}
.g1{color:#4285F4}.g2{color:#EA4335}.g3{color:#FBBC05}.g4{color:#4285F4}.g5{color:#34A853}.g6{color:#EA4335}
.stars-row{display:flex;justify-content:center;gap:3px;margin-bottom:14px}
.star{font-size:24px;color:#FBBC05}
.scan-title{font-size:17px;font-weight:900;color:#1a1a2e;letter-spacing:0.5px;margin-bottom:2px}
.scan-sub{font-size:11px;font-weight:600;color:#666;letter-spacing:1px;margin-bottom:16px;text-transform:uppercase}
.qr-wrap{position:relative;width:180px;height:180px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center}
.qr-inner{width:160px;height:160px}
.qr-inner canvas,.qr-inner img{width:160px!important;height:160px!important}
.corner{position:absolute;width:28px;height:28px}
.corner::before,.corner::after{content:'';position:absolute;background:currentColor}
.corner-tl{top:0;left:0;color:#EA4335}.corner-tl::before{top:0;left:0;width:28px;height:5px}.corner-tl::after{top:0;left:0;width:5px;height:28px}
.corner-tr{top:0;right:0;color:#4285F4}.corner-tr::before{top:0;right:0;width:28px;height:5px}.corner-tr::after{top:0;right:0;width:5px;height:28px}
.corner-bl{bottom:0;left:0;color:#FBBC05}.corner-bl::before{bottom:0;left:0;width:28px;height:5px}.corner-bl::after{bottom:0;left:0;width:5px;height:28px}
.corner-br{bottom:0;right:0;color:#34A853}.corner-br::before{bottom:0;right:0;width:28px;height:5px}.corner-br::after{bottom:0;right:0;width:5px;height:28px}
.biz-name-label{font-size:12px;font-weight:700;color:#1a1a2e;margin-bottom:3px}
.url-label{font-size:10px;color:#aaa;margin-bottom:14px}
.powered{border-top:1px solid #f0f0f0;padding-top:10px;font-size:10px;color:#aaa;font-weight:500}
.powered b{color:#4285F4;font-weight:700}
@media print{body{background:white;padding:0}.controls{display:none}.card{box-shadow:none}}
</style>
</head>
<body>
<div class="controls">
  <button class="btn btn-print" onclick="window.print()">Print Poster</button>
</div>
<div class="card" id="poster">
  <div class="logos-row">
    <div class="client-logo-wrap" id="clientLogoWrap">
      <div class="client-name-text" id="clientNameText">...</div>
    </div>
    <div class="divider-dot"></div>
    <div class="ai-logo-wrap">
      <div class="ai-logo-inner">ADVIZR<br>MEDIA<br>&#9889;</div>
    </div>
  </div>
  <div class="g-text"><span class="g1">G</span><span class="g2">o</span><span class="g3">o</span><span class="g4">g</span><span class="g5">l</span><span class="g6">e</span></div>
  <div class="stars-row"><span class="star">&#9733;</span><span class="star">&#9733;</span><span class="star">&#9733;</span><span class="star">&#9733;</span><span class="star">&#9733;</span></div>
  <div class="scan-title">SCAN QR CODE</div>
  <div class="scan-sub">To Leave Us a Review</div>
  <div class="qr-wrap">
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>
    <div class="qr-inner" id="qrCode"></div>
  </div>
  <div class="biz-name-label" id="bizLabel"></div>
  <div class="url-label">reviews.advizrmedia.com</div>
  <div class="powered">Powered by <b>Advizr Media</b></div>
</div>
<script>
var id=new URLSearchParams(location.search).get('b')||'orthoderma';
var reviewUrl='https://reviews.advizrmedia.com/?b='+id;
new QRCode(document.getElementById('qrCode'),{text:reviewUrl,width:160,height:160,colorDark:'#000000',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});
fetch('/business/'+id).then(function(r){return r.json();}).then(function(biz){
  document.getElementById('bizLabel').textContent=biz.name||'';
  document.getElementById('clientNameText').textContent=biz.name||id;
  document.title='QR Poster - '+(biz.name||id);
  if(biz.logoUrl){
    document.getElementById('clientLogoWrap').innerHTML='<img src="'+biz.logoUrl+'" alt="logo">';
  }
}).catch(function(){});
</script>
</body>
</html>
