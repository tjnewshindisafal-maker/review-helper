<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advizr Media - Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',sans-serif;background:#F0F4FF;min-height:100vh}
.lw{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:1rem}
.lc{background:white;border-radius:20px;padding:2rem;max-width:360px;width:100%;box-shadow:0 4px 24px rgba(0,0,0,.1);text-align:center}
.li{font-size:40px;margin-bottom:12px}
.lt{font-size:22px;font-weight:800;color:#1a1a2e;margin-bottom:6px}
.ls{font-size:13px;color:#888;margin-bottom:24px}
.inp{width:100%;padding:12px 16px;border:2px solid #E8EAF0;border-radius:12px;font-size:15px;font-family:'Plus Jakarta Sans',sans-serif;outline:none;margin-bottom:12px}
.lbtn{width:100%;padding:14px;background:#4285F4;color:white;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer}
.lerr{color:#D93025;font-size:13px;margin-top:8px;display:none}
.dash{display:none}
.topbar{background:white;padding:1rem 1.5rem;display:flex;align-items:center;justify-content:space-between;box-shadow:0 1px 8px rgba(0,0,0,.06)}
.logo{font-size:20px;font-weight:800;color:#1a1a2e}
.logo span{color:#4285F4}
.tbadge{background:#EEF2FF;color:#4285F4;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px}
.tbtn{padding:8px 16px;border:1.5px solid #E8EAF0;border-radius:10px;background:white;color:#555;font-size:13px;font-weight:600;cursor:pointer}
.main{padding:1.5rem;max-width:1100px;margin:0 auto}
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;margin-bottom:1.5rem}
.sc{background:white;border-radius:16px;padding:1.25rem;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.slbl{font-size:12px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.sval{font-size:32px;font-weight:800;margin-bottom:4px}
.ssub{font-size:12px;color:#888}
.sc.bl .sval{color:#4285F4}
.sc.gr .sval{color:#34A853}
.sc.rd .sval{color:#EA4335}
.sc.or .sval{color:#FF6B35}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
.st{font-size:16px;font-weight:800;color:#1a1a2e}
.addbtn{padding:10px 18px;background:#4285F4;color:white;border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer}
.tw{background:white;border-radius:16px;box-shadow:0 2px 8px rgba(0,0,0,.06);overflow:auto;margin-bottom:1.5rem}
table{width:100%;border-collapse:collapse;min-width:600px}
th{padding:12px 16px;text-align:left;font-size:11px;font-weight:700;color:#888;text-transform:uppercase;background:#F8F9FF;border-bottom:1px solid #F0F0F5}
td{padding:14px 16px;font-size:14px;color:#333;border-bottom:1px solid #F0F0F5}
.bn{font-weight:700;color:#1a1a2e}
.bt{font-size:12px;color:#888}
.cnt{font-weight:700;color:#4285F4}
.cntn{font-weight:700;color:#EA4335}
.abtn{display:flex;gap:6px}
.bqr{padding:6px 12px;background:#EEF2FF;color:#4285F4;border:none;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer}
.bol{padding:6px 12px;background:#E8F5E9;color:#2E7D32;border:none;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer}
.ov{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:999;align-items:center;justify-content:center;padding:1rem}
.mod{background:white;border-radius:20px;padding:1.5rem;max-width:480px;width:100%;max-height:90vh;overflow-y:auto}
.mtitle{font-size:18px;font-weight:800;color:#1a1a2e;margin-bottom:1.25rem}
.fg{margin-bottom:14px}
.fl{display:block;font-size:12px;font-weight:600;color:#555;margin-bottom:6px}
.fi{width:100%;padding:10px 14px;border:2px solid #E8EAF0;border-radius:10px;font-size:14px;font-family:'Plus Jakarta Sans',sans-serif;outline:none}
.fr{display:flex;gap:10px}
.fr .fg{flex:1}
.mbtns{display:flex;gap:10px;margin-top:16px}
.bcan{flex:1;padding:12px;border:2px solid #E8EAF0;border-radius:10px;background:white;color:#555;font-size:14px;font-weight:600;cursor:pointer}
.bsav{flex:2;padding:12px;background:#4285F4;color:white;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer}
.qmod{background:white;border-radius:20px;padding:1.5rem;max-width:320px;width:100%;text-align:center}
.qurl{font-size:11px;color:#4285F4;background:#EEF2FF;padding:6px 12px;border-radius:8px;word-break:break-all;margin:8px 0;display:block}
.bprint{width:100%;padding:12px;background:#333;color:white;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:8px}
.bcls{width:100%;padding:10px;background:none;border:none;color:#aaa;font-size:13px;cursor:pointer}
.ldg{text-align:center;padding:2rem;color:#888;font-size:14px}
</style>
</head>
<body>
<div class="lw" id="loginWrap">
  <div class="lc">
    <div class="li">&#128272;</div>
    <div class="lt">Admin Dashboard</div>
    <div class="ls">Advizr Media ReviewHelper</div>
    <input type="password" class="inp" id="passInput" placeholder="Enter password"/>
    <button class="lbtn" id="loginBtn">Login</button>
    <div class="lerr" id="loginErr">Wrong password!</div>
  </div>
</div>
<div class="dash" id="dashboard">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:10px">
      <div class="logo">Advizr<span>Media</span></div>
      <div class="tbadge">Admin Panel</div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="tbtn" id="refreshBtn" style="color:#4285F4">Refresh</button>
      <button class="tbtn" id="logoutBtn">Logout</button>
    </div>
  </div>
  <div class="main">
    <div class="sgrid">
      <div class="sc bl"><div class="slbl">Total Clients</div><div class="sval" id="s1">-</div><div class="ssub">Active businesses</div></div>
      <div class="sc gr"><div class="slbl">Total Scans</div><div class="sval" id="s2">-</div><div class="ssub">QR scans</div></div>
      <div class="sc or"><div class="slbl">Reviews Generated</div><div class="sval" id="s3">-</div><div class="ssub">AI reviews</div></div>
      <div class="sc rd"><div class="slbl">Negative Feedback</div><div class="sval" id="s4">-</div><div class="ssub">Shielded</div></div>
    </div>
    <div class="sh">
      <div class="st">All Clients</div>
      <button class="addbtn" id="addBtn">+ Add Client</button>
    </div>
    <div class="tw">
      <table>
        <thead><tr><th>Business</th><th>Scans</th><th>Generated</th><th>Submitted</th><th>Negative</th><th>Actions</th></tr></thead>
        <tbody id="clientTable"><tr><td colspan="6" class="ldg">Loading...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>
<div class="ov" id="addModal">
  <div class="mod">
    <div class="mtitle">Add New Client</div>
    <div class="fr">
      <div class="fg"><label class="fl">Business ID</label><input class="fi" id="nId" placeholder="myclinic"/></div>
      <div class="fg"><label class="fl">Icon</label><input class="fi" id="nIcon" placeholder="&#127973;"/></div>
    </div>
    <div class="fg"><label class="fl">Business Name</label><input class="fi" id="nName" placeholder="City Dental Clinic"/></div>
    <div class="fg"><label class="fl">Google Review URL</label><input class="fi" id="nLink" placeholder="https://g.page/r/xxx/review"/></div>
    <div class="fg"><label class="fl">Services (comma separated)</label><input class="fi" id="nServices" placeholder="Root Canal, Cleaning"/></div>
    <div class="fg"><label class="fl">Keywords (comma separated)</label><input class="fi" id="nKeywords" placeholder="dental, dentist"/></div>
    <div class="mbtns">
      <button class="bcan" id="cancelBtn">Cancel</button>
      <button class="bsav" id="saveBtn">Save Client</button>
    </div>
  </div>
</div>
<div class="ov" id="qrModal">
  <div class="qmod">
    <div style="font-size:16px;font-weight:800;color:#1a1a2e;margin-bottom:8px" id="qrName"></div>
    <div id="qrWrap" style="margin:12px 0"></div>
    <span class="qurl" id="qrUrl"></span>
    <button class="bprint" id="printBtn">Print QR</button>
    <button class="bcls" id="closeQr">Close</button>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<script>
var AP='admin123',BU='https://reviews.advizrmedia.com/?b=',data=[],pass='';
document.getElementById('loginBtn').onclick=login;
document.getElementById('passInput').onkeydown=function(e){if(e.key==='Enter')login();};
document.getElementById('logoutBtn').onclick=function(){document.getElementById('loginWrap').style.display='flex';document.getElementById('dashboard').style.display='none';document.getElementById('passInput').value='';};
document.getElementById('refreshBtn').onclick=load;
document.getElementById('addBtn').onclick=function(){document.getElementById('addModal').style.display='flex';};
document.getElementById('cancelBtn').onclick=function(){document.getElementById('addModal').style.display='none';};
document.getElementById('saveBtn').onclick=save;
document.getElementById('printBtn').onclick=function(){var c=document.getElementById('qrCanvas');var w=window.open('');w.document.write('<img src="'+c.toDataURL()+'" style="width:300px"/>');w.print();};
document.getElementById('closeQr').onclick=function(){document.getElementById('qrModal').style.display='none';};
function login(){var p=document.getElementById('passInput').value;if(p===AP){pass=p;document.getElementById('loginWrap').style.display='none';document.getElementById('dashboard').style.display='block';load();}else{document.getElementById('loginErr').style.display='block';}}
async function load(){try{var r=await fetch('/analytics-all?pass='+pass);data=await r.json();stats();table();}catch(e){console.error(e);}}
function stats(){document.getElementById('s1').textContent=data.length;document.getElementById('s2').textContent=data.reduce(function(s,b){return s+(b.scans||0);},0);document.getElementById('s3').textContent=data.reduce(function(s,b){return s+(b.generated||0);},0);document.getElementById('s4').textContent=data.reduce(function(s,b){return s+(b.negative||0);},0);}
function table(){var tb=document.getElementById('clientTable');if(!data.length){tb.innerHTML='<tr><td colspan="6" class="ldg">No clients</td></tr>';return;}var h='';data.forEach(function(b){h+='<tr><td><div style="display:flex;align-items:center;gap:8px"><span style="font-size:20px">'+(b.icon||'')+'</span><div><div class="bn">'+b.name+'</div><div class="bt">'+b.id+'</div></div></div></td><td><span class="cnt">'+(b.scans||0)+'</span></td><td><span class="cnt">'+(b.generated||0)+'</span></td><td><span class="cnt">'+(b.submitted||0)+'</span></td><td><span class="cntn">'+(b.negative||0)+'</span></td><td><div class="abtn"><button class="bqr" data-id="'+b.id+'" data-name="'+b.name+'" data-icon="'+(b.icon||'')+'">QR</button><button class="bol" data-url="'+BU+b.id+'">Open</button></div></td></tr>';});tb.innerHTML=h;document.querySelectorAll('.bqr').forEach(function(btn){btn.onclick=function(){showQR(this.dataset.id,this.dataset.name,this.dataset.icon);};});document.querySelectorAll('.bol').forEach(function(btn){btn.onclick=function(){window.open(this.dataset.url,'_blank');};});}
function showQR(id,name,icon){document.getElementById('qrName').textContent=icon+' '+name;var url=BU+id;document.getElementById('qrUrl').textContent=url;document.getElementById('qrWrap').innerHTML='<canvas id="qrCanvas"></canvas>';QRCode.toCanvas(document.getElementById('qrCanvas'),url,{width:200,margin:1,color:{dark:'#000',light:'#fff'}});document.getElementById('qrModal').style.display='flex';}
async function save(){var id=document.getElementById('nId').value.trim().toLowerCase().replace(/\s+/g,'');var name=document.getElementById('nName').value.trim();var icon=document.getElementById('nIcon').value.trim();var link=document.getElementById('nLink').value.trim();var svcs=document.getElementById('nServices').value.split(',').map(function(s){return s.trim();}).filter(Boolean);var kws=document.getElementById('nKeywords').value.split(',').map(function(s){return s.trim();}).filter(Boolean);if(!id||!name||!link){alert('Fill all fields!');return;}try{var r=await fetch('/add-business',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:id,name:name,icon:icon,googleLink:link,services:svcs,keywords:kws,pass:pass})});var d=await r.json();if(d.error)throw new Error(d.error);alert('Client added! '+BU+id);document.getElementById('addModal').style.display='none';load();}catch(e){alert('Error: '+e.message);}}
</script>
</body>
</html>
