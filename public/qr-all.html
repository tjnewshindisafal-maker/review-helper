<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>All QR Cards — Print Sheet</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: Arial, Helvetica, sans-serif;
  background: #e8eaf0;
  padding: 20px;
}
.toolbar {
  display: flex;
  gap: 12px;
  align-items: center;
  justify-content: center;
  margin-bottom: 24px;
  flex-wrap: wrap;
}
.btn {
  padding: 10px 24px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 700;
}
.btn-print { background: #1a73e8; color: #fff; }
.btn-print:hover { background: #1557b0; }
#status { font-size: 13px; color: #555; }

/* A2 sheet: 420mm x 594mm */
.sheet {
  width: 420mm;
  min-height: 594mm;
  background: #fff;
  margin: 0 auto;
  padding: 10mm;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-template-rows: repeat(6, 1fr);
  gap: 6mm;
  box-shadow: 0 4px 20px rgba(0,0,0,0.15);
}

/* ===== MINI CARD (fits grid cell) ===== */
.card {
  background: #fff;
  border: 1px dashed #ccc;
  border-radius: 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  padding: 8px 6px 6px;
  position: relative;
  overflow: hidden;
  min-height: 88mm;
}

.card::after {
  content: '';
  position: absolute;
  top: 0; right: 0;
  width: 4px;
  height: 100%;
  background: linear-gradient(
    to bottom,
    #4285F4 0%, #4285F4 25%,
    #EA4335 25%, #EA4335 50%,
    #FBBC04 50%, #FBBC04 75%,
    #34A853 75%, #34A853 100%
  );
}

.logo-circle {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: 1.5px solid #e0e0e0;
  background: #fafafa;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  overflow: hidden;
}

.google-logo {
  font-size: 14px;
  font-weight: 700;
  letter-spacing: -0.3px;
  line-height: 1.1;
  margin: 2px 0;
}
.g-b { color: #4285F4; }
.g-r { color: #EA4335; }
.g-y { color: #FBBC04; }
.g-g { color: #34A853; }

.stars { color: #FBBC04; font-size: 9px; letter-spacing: 1.5px; margin-bottom: 2px; }
.scan-label { font-size: 5.5px; font-weight: 800; letter-spacing: 1px; color: #111; }
.scan-sub { font-size: 4px; letter-spacing: 0.8px; color: #666; margin-top: 1px; margin-bottom: 4px; }

.qr-wrap { padding: 3px; border: 1.5px solid #eee; border-radius: 5px; background: #fff; }
.qr-wrap canvas { display: block; }

.biz-name {
  font-size: 6px;
  font-weight: 800;
  color: #111;
  text-align: center;
  line-height: 1.3;
  padding: 0 4px;
  margin: 4px 0 2px;
}

.card-footer {
  width: 100%;
  border-top: 1px solid #eee;
  padding-top: 4px;
  text-align: center;
}
.card-domain { font-size: 4px; color: #aaa; }
.card-powered { font-size: 4px; color: #bbb; margin-top: 1px; }
.card-powered span { color: #1a73e8; font-weight: 700; }

@media print {
  .toolbar { display: none; }
  body { background: white; padding: 0; }
  .sheet { box-shadow: none; margin: 0; }
  .card { border-color: #ddd; }
}
</style>
</head>
<body>

<div class="toolbar" id="toolbar">
  <button class="btn btn-print" onclick="window.print()">🖨 Print A2 Sheet</button>
  <span id="status">Loading businesses...</span>
</div>

<div class="sheet" id="sheet"></div>

<script>
async function loadAll() {
  const statusEl = document.getElementById('status');
  let businesses;
  try {
    const res = await fetch('/business-list');
    businesses = await res.json();
  } catch(e) {
    statusEl.textContent = 'Error loading businesses';
    return;
  }

  const sheet = document.getElementById('sheet');
  const entries = Object.entries(businesses);
  statusEl.textContent = entries.length + ' cards loaded';

  entries.forEach(([id, biz]) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="logo-circle"><span class="icon">${biz.icon || '🏢'}</span></div>
      <div class="google-logo">
        <span class="g-b">G</span><span class="g-r">o</span><span class="g-y">o</span><span class="g-b">g</span><span class="g-g">l</span><span class="g-r">e</span>
      </div>
      <div class="stars">★★★★★</div>
      <div class="scan-label">SCAN QR CODE</div>
      <div class="scan-sub">TO LEAVE US A REVIEW</div>
      <div class="qr-wrap" id="qr-${id}"></div>
      <div class="biz-name">${biz.name}</div>
      <div class="card-footer">
        <div class="card-domain">reviews.advizrmedia.com</div>
        <div class="card-powered">Powered by <span>Advizr Media</span></div>
      </div>
    `;
    sheet.appendChild(card);

    const url = biz.googleLink || ('https://reviews.advizrmedia.com/?b=' + id);
    new QRCode(document.getElementById('qr-' + id), {
      text: url,
      width: 70,
      height: 70,
      colorDark: '#000000',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.M
    });
  });
}

loadAll();
</script>
</body>
</html>
